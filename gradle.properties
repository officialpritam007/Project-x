# Kotlin 2.1/Compose compile needs headroom without starving 7 GiB Linux CI runners.
# Preserve single-worker / in-process compilation so only one large JVM is resident.
org.gradle.jvmargs=-Xmx5600m -XX:MaxMetaspaceSize=640m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
android.useAndroidX=true
kotlin.code.style=official
