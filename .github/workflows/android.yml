name: Android candidate checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HAS_OWNER_DEBUG_KEY: ${{ secrets.DEBUG_KEYSTORE_BASE64 != '' }}
      FCM_APP_ID: ${{ vars.FCM_APP_ID }}
      FCM_PROJECT_ID: ${{ vars.FCM_PROJECT_ID }}
      FCM_API_KEY: ${{ vars.FCM_API_KEY }}
      FCM_SENDER_ID: ${{ vars.FCM_SENDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify host tooling safety and audit completeness
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore development signing key
        if: env.HAS_OWNER_DEBUG_KEY != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: liquid-debug-signing-v1
      - name: Prepare the exact development signing path
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          python - <<'PYKEY'
          import os,base64,pathlib,subprocess
          value=os.environ.get("DEBUG_KEYSTORE_BASE64", "")
          key=pathlib.Path.home()/".android"/"debug.keystore"
          key.parent.mkdir(parents=True,exist_ok=True)
          if value:
              key.write_bytes(base64.b64decode(value,validate=True))
          elif not key.is_file():
              # Development identity only. Production always requires the owner's upload key.
              subprocess.run(['keytool','-genkeypair','-noprompt','-keystore',str(key),'-alias','androiddebugkey','-storepass','android','-keypass','android','-dname','CN=Android Debug,O=Android,C=US','-keyalg','RSA','-keysize','2048','-validity','10950'],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write('LIQUID_DEBUG_KEYSTORE_PATH='+str(key)+'\n')
          PYKEY
      - name: Tests, lint and APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug testReleaseUnitTest lintRelease bundleRelease
      - name: Inventory resolved release dependencies and declared licenses
        run: ./gradlew --no-daemon -I scripts/dependency_inventory.init.gradle :app:exportDependencyInventory
      - name: Validate APK signature, alignment and native page compatibility
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/debug-certificate.txt
          python3 - <<'PYIDENTITY'
          import os,subprocess,hashlib,re
          from pathlib import Path
          public_cert=subprocess.check_output(['keytool','-exportcert','-keystore',os.environ['LIQUID_DEBUG_KEYSTORE_PATH'],'-alias','androiddebugkey','-storepass','android'],stderr=subprocess.DEVNULL)
          actual=re.search(r'certificate SHA-256 digest: ([0-9a-fA-F]+)',Path('app/build/outputs/debug-certificate.txt').read_text()).group(1).lower()
          if hashlib.sha256(public_cert).hexdigest()!=actual:
              raise SystemExit('APK does not use the prepared development signing identity.')
          print('APK uses the exact prepared development signing identity.')
          PYIDENTITY
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/debug-package.txt
          python3 scripts/verify_artifacts.py app/build/outputs/apk/debug/app-debug.apk app/build/outputs/bundle/release/app-release.aab --output app/build/outputs/candidate-metadata.json
      - name: Report public FCM configuration presence
        run: |
          python3 - <<'PYFCM'
          import os,json
          from pathlib import Path
          flags={k:bool(os.environ.get(k)) for k in ('FCM_APP_ID','FCM_PROJECT_ID','FCM_API_KEY','FCM_SENDER_ID')}
          Path('app/build/outputs/fcm-config-presence.json').write_text(json.dumps(flags,indent=2))
          print('FCM public Android config: '+('complete' if all(flags.values()) else 'incomplete: push acceptance blocked'))
          PYFCM
      - name: Upload unsigned release bundle for inspection
        uses: actions/upload-artifact@v4
        with:
          name: Liquid-Chat-UNSIGNED-bundle-${{ github.run_number }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
      - name: Upload candidate provenance
        uses: actions/upload-artifact@v4
        with:
          name: candidate-metadata-${{ github.run_number }}
          path: |
            app/build/outputs/candidate-metadata.*
            app/build/outputs/debug-certificate.txt
            app/build/outputs/debug-package.txt
            app/build/outputs/fcm-config-presence.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Liquid-Chat-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports-${{ github.run_number }}
          path: |
            app/build/reports/
          if-no-files-found: ignore

  device-db-checks:
    name: Android API ${{ matrix.api }}
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35, 36]
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Download exact distributable for emulator smoke check
        uses: actions/download-artifact@v4
        with:
          name: Liquid-Chat-debug-${{ github.run_number }}
          path: candidate-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            bash -c './gradlew --no-daemon connectedDebugAndroidTest; test_status=$?; adb pull /sdcard/Pictures/LiquidChatUiChecks app/build/outputs/ui-screenshots; if [ "$test_status" -ne 0 ]; then exit "$test_status"; fi; LIQUID_DISPOSABLE_EMULATOR=1 bash scripts/smoke_candidate.sh candidate-apk/app-debug.apk app/build/outputs/candidate-smoke'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-db-reports-api-${{ matrix.api }}-${{ github.run_number }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/ui-screenshots/
            app/build/outputs/candidate-smoke/
          if-no-files-found: ignore

  edge-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.4
      - name: Type-check Edge Function sources
        working-directory: supabase/functions
        run: deno check --frozen --lock=deno.lock media/index.ts notify/index.ts account/index.ts media-cleanup/index.ts
      - name: Validate private media and admin request boundaries
        working-directory: supabase/functions
        run: deno test --allow-env=WS_NO_BUFFER_UTIL,WS_NO_UTF_8_VALIDATE --frozen --lock=deno.lock media/inspect_test.ts account/admin_input_test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edge-lock-${{ github.run_number }}
          path: supabase/functions/deno.lock
          if-no-files-found: ignore
