name: Android debug APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HAS_OWNER_DEBUG_KEY: ${{ secrets.DEBUG_KEYSTORE_BASE64 != '' }}
      FCM_APP_ID: ${{ vars.FCM_APP_ID }}
      FCM_PROJECT_ID: ${{ vars.FCM_PROJECT_ID }}
      FCM_API_KEY: ${{ vars.FCM_API_KEY }}
      FCM_SENDER_ID: ${{ vars.FCM_SENDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore development signing key
        if: env.HAS_OWNER_DEBUG_KEY != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: liquid-debug-signing-v1
      - name: Use owner-provided development key when configured
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          python - <<'PYKEY'
          import os,base64,pathlib
          value=os.environ.get("DEBUG_KEYSTORE_BASE64", "")
          if value:
              key=pathlib.Path.home()/".android"/"debug.keystore"
              key.parent.mkdir(parents=True,exist_ok=True)
              key.write_bytes(base64.b64decode(value,validate=True))
          PYKEY
      - name: Tests, lint and APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Liquid-Chat-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports-${{ github.run_number }}
          path: |
            app/build/reports/
          if-no-files-found: ignore

  device-db-checks:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            gradle --no-daemon connectedDebugAndroidTest
            adb pull /sdcard/Android/data/com.pritam.liquidchat/files/screenshots app/build/outputs/ui-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-db-reports-${{ github.run_number }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/ui-screenshots/
          if-no-files-found: ignore

  edge-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.4
      - name: Type-check Edge Function sources
        working-directory: supabase/functions
        run: deno check --frozen --lock=deno.lock media/index.ts notify/index.ts account/index.ts media-cleanup/index.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edge-lock-${{ github.run_number }}
          path: supabase/functions/deno.lock
          if-no-files-found: ignore
